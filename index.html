<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deck</title>
  <!-- Brand: font (pairs with brand.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="engine/chrome.css">
  <!-- The engine appends stages/<stage>/{tokens,stage,layouts}.css from the deck's `stage:` -->
</head>
<body>

  <!-- Fixed chrome: lives outside the scroll container -->
  <header class="chrome chrome--top">
    <span class="chrome__title" data-deck-title></span>
    <span class="chrome__section" data-current-section></span>
    <!-- Icons: Lucide (ISC), inlined. Stroke inherits currentColor. -->
    <button class="chrome__button" data-grid-toggle type="button" aria-pressed="false" aria-label="Grid overlay" title="Grid overlay (G)">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
    </button>
    <button class="chrome__button" data-present-toggle type="button" aria-pressed="false" aria-label="Present" title="Present (F)">
      <svg class="icon icon--off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></svg>
      <svg class="icon icon--on" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </header>

  <!-- Design aid: shows the column grid and baseline rhythm (G) -->
  <div class="grid-overlay" data-grid-overlay aria-hidden="true" hidden></div>

  <div class="chrome chrome--bottom" aria-hidden="true">
    <div class="progress"><div class="progress__bar" data-progress></div></div>
    <!-- Swap in the official mark; add a <source media="(prefers-color-scheme: dark)"> if it has a reversed version -->
    <picture class="brand-mark"><img src="media/brand-mark.svg" alt=""></picture>
  </div>

  <!-- The deck: scenes are rendered here from decks/<name>/deck.md.
       Pick a deck with ?deck=<name>; data-deck is the default. -->
  <main class="deck" data-deck="demo-story"></main>

  <script src="engine/app.js"></script>
</body>
</html>
